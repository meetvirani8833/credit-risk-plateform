server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file serves
    # index.html so React Router handles it client-side, otherwise a
    # reload on e.g. /chat 404s at the web server level (same issue
    # solved on Vercel with vercel.json's rewrite rule).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
